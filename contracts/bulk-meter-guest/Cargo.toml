[workspace]

[package]
name = "bulk-meter-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Minimal CosmWasm guest that issues memory.copy/fill with a caller-chosen length"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { path = "../../../_worktrees/cosmwasm-bulk-memory/packages/std", default-features = false, features = ["std", "exports"] }
serde = { version = "1", default-features = false, features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
