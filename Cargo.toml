[workspace]
members = [
    "ict-rs",
    "ict-rs-codegen",
    "ict-rs-cw-orch",
    "ict-rs-derive",
    "pir-live-chain",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

# rayon 1.12 ParallelIterator is not Iterator; halo2 TheBestReduce needs 1.10.2
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bech32 = "0.11"
bip32 = "0.5"
bip39 = "2"
blake3 = "1"
bollard = { version = "0.18" }
cosmrs = { package = "cosmrs", version = "0.23.0" }
cosmwasm-std = { version = "=4.1.0" }
criterion = "0.5"
cw-headstash = { path = "../headstash/contracts/cw-headstash", default-features = false }
cw-orch = { version = "0.30.0", default-features = false }
cw-orch-core = { version = "2.1.4", default-features = false }
cw-orch-daemon = "0.29.0"
cw-orch-traits = "0.25.0"
dregg = { path = "../terp-rs/tools/svg-mint/crates/dregg" }
ed25519-dalek = "2.1"
futures = "0.3"
futures-util = "0.3"
halo2_proofs = { package = "zakura-halo2-proofs", version = "=1.3.0-alpha.1", default-features = false }
hash-market = { path = "../terp-rs/tools/hash-market", default-features = false }
heck = "0.5"
hex = "0.4"
ics23 = { package = "ics23", version = "0.12.0", default-features = false }
ict-rs = { path = "ict-rs" }
ict-rs-cw-orch = { path = "ict-rs-cw-orch" }
ict-rs-derive = { path = "ict-rs-derive" }
k256 = "0.13"
log = "0.4.22"
o-line-sdl = { path = "../o-line" }
proc-macro2 = "1"
prost = "0.14.3"
prost-build = "0.14.3"
prost-types = "0.14.3"
quote = "1"
rand = "0.8"
rayon = "=1.10.0"
regex = "1"
ripemd = "0.1"
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
syn = "2"
tar = "0.4"
tempfile = "3"
tendermint = { package = "tendermint", version = "0.40.4" }
tendermint-rpc = { package = "tendermint-rpc", version = "0.40.4" }
terp-rs = { package = "terp-rs", path = "../terp-rs/crates/sdk" }
thiserror = "2"
tokio = "1"
tokio-test = "0.4"
tokio-tungstenite = "0.21"
toml = "0.8"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
wat = "1"
zk-cosmwasm = { version = "=4.1.0", default-features = false }
[patch.crates-io]

ics23 = { path = "../ics23/rust" }
zk-cosmwasm = { path = "../cosmwasm/packages/zk" }
ibc-proto = { path = "../ibc-proto-rs" }
cw-storage-plus = { path = "../cw-storage-plus" }
cosmrs = { path = "../cosmos-rust/cosmrs" }
cw-orch = { path = "../cw-orchestrator/cw-orch" }
cw-orch-core = { path = "../cw-orchestrator/packages/cw-orch-core" }
cw-orch-daemon = { path = "../cw-orchestrator/cw-orch-daemon" }
cw-orch-traits = { path = "../cw-orchestrator/packages/cw-orch-traits" }
tendermint = { path = "../tendermint-rs/tendermint" }
tendermint-rpc = { path = "../tendermint-rs/rpc" }
abstract-cw-multi-test = { path = "../cw-multi-test-fork" }
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
tendermint-proto = { path = "../tendermint-rs/proto" }
cw20-ics20 = { path = "../cw-plus/contracts/cw20-ics20" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw-controllers = { path = "../cw-minus/packages/controllers" }
cw-ownable = { path = "../cw-plus-plus/packages/ownable" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
