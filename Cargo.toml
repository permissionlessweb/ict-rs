[workspace]
members = [
    "ict-rs",
    "ict-rs-codegen",
    "ict-rs-cw-orch",
    "ict-rs-derive",
    "pir-live-chain",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

# rayon 1.12 ParallelIterator is not Iterator; halo2 TheBestReduce needs 1.10.2
[workspace.dependencies]
rayon = "=1.10.0"
