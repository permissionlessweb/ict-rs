# Called from terp-core (or locally) after the chain image tarball exists.
# This repo only compiles ict-rs once; callers run suites.
name: reusable ict-rs e2e
on:
  workflow_call:
    inputs:
      suites:
        description: "JSON array of suite names"
        type: string
        default: [ibc_transfer,polytone]
      rust_version:
        type: string
        default: "1.88"
jobs:
  # compile-only path when used from this repo; terp-core inlines the same steps
  # so the lockfile cache lives next to the workspace that has path deps.
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "use terp-core .github/workflows/interchaintest-E2E.yml for the full graph"
