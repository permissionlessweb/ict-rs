[package]
name = "pir-live-chain"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pir-live-attach"
path = "src/main.rs"

[dependencies]
ict-rs = { path = "../ict-rs", features = ["docker", "terp", "testing"] }
ict-rs-cw-orch = { path = "../ict-rs-cw-orch", features = ["docker"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
