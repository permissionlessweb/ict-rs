path = "../examples/loyalty_rewards_zkjwt.rs"

# Marketplace mirror inventory harness (parallel to loyalty_rewards).
# Offline delta: marketplace_inventory_offline. Docker: needs Agent A wasm.
[[example]]
name = "marketplace_inventory"
path = "../examples/marketplace_inventory.rs"
required-features = ["docker", "hashmerchant"]

[[example]]
name = "marketplace_inventory_offline"
path = "../examples/marketplace_inventory_offline.rs"

# HashMerchant NFT oracle minter lab (hm-loyalty/v1 + Mode A/C price).
