[package]
name = "ict-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust re-implementation of the Interchain Test framework"

[features]
default = ["full"]
full = ["docker", "ethereum", "testing", "terp", "akash"]
docker = ["dep:bollard"]
kuasar = ["dep:tonic"]
testing = []
ethereum = ["dep:sha3"]
# Chain module features
terp = [
    "tokenfactory",
    "feeshare",
    "drip",
    "clock",
    "hashmerchant",
    "smartaccount",
    "globalfee",
]
tokenfactory = []
feeshare = []
drip = []
clock = []
hashmerchant = []
smartaccount = []
globalfee = []
akash = []
nostr = ["dep:tokio-tungstenite", "dep:futures-util"]
# Local Zakura (Zcash regtest) node spawn for private-bridge Option D / D6.
# Requires Docker runtime (bollard). Binary path: ZAKURAD_BIN or ZakuraNodeConfig.
zakura = ["docker"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
bollard = { version = "0.18", optional = true }
# For Nostr NIP-01 WS client (local relay testing)
tokio-tungstenite = { version = "0.21", features = ["connect"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
cosmrs = { path = "../../cosmos-rust/cosmrs", package = "cosmrs", features = ["cosmwasm", "grpc"] }
log = "0.4.22"
prost = "0.14"
tendermint = { path = "../../tendermint-rs/tendermint", package = "tendermint" }
tendermint-rpc = { path = "../../tendermint-rs/rpc", package = "tendermint-rpc", features = ["http-client", "websocket-client"] }
tonic = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
bip32 = "0.5"
bip39 = { version = "2", features = ["default"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
sha2 = "0.10"
sha3 = { version = "0.10", optional = true }

# Utilities
bech32 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
toml = "0.8"
tracing = "0.1"

# Derive macros
cw-orch-core = { path = "../../cw-orchestrator/packages/cw-orch-core", package = "cw-orch-core", features = ["terp"] }
ict-rs-derive = { path = "../ict-rs-derive" }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bip39 = { version = "2", features = ["default"] }
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = { version = "3", optional = false }
terp-rs = { path = "../../terp-rs/crates/sdk", package = "terp-rs", features = ["rpc"] }
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "runtime_bench"
harness = false

[[example]]
name = "basic_cosmos"
path = "../examples/basic_cosmos.rs"

[[example]]
name = "ibc_transfer"
path = "../examples/ibc_transfer.rs"
required-features = ["docker"]

[[example]]
name = "ibc_transfer_e2e"
path = "../examples/ibc_transfer_e2e.rs"
required-features = ["docker"]

[[example]]
