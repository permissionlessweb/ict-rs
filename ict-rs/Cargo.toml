[[example]]
name = "hashmerchant_nft_oracle_mint"
path = "../examples/hashmerchant_nft_oracle_mint.rs"

# HashMerchant L3: fresh Ubuntu → hm-support bootstrap → runtime health/VE (install packaging).
# Handoff: docs/bootstrap/hashmerchant-ict-bootstrap-e2e-handoff.md
[[example]]
name = "hashmerchant_bootstrap_ubuntu"
path = "../examples/hashmerchant_bootstrap_ubuntu.rs"
required-features = ["docker"]

# Client → isolated server ingress conductor (PR1: S1 mock server + S2 client attach).
# Design: docs/bootstrap/hashmerchant-client-ingress-sequence.md
