[package]
name = "ict-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust re-implementation of the Interchain Test framework"

[features]
default = ["full"]
full = ["docker", "ethereum", "testing", "terp", "akash"]
docker = ["dep:bollard"]
kuasar = ["dep:tonic"]
testing = []
ethereum = ["dep:sha3"]
# Chain module features
terp = [
    "tokenfactory",
    "feeshare",
    "drip",
    "clock",
    "hashmerchant",
    "smartaccount",
    "globalfee",
]
tokenfactory = []
feeshare = []
drip = []
clock = []
hashmerchant = []
# Local Docker headstash epoch: sidecar + cw-headstash claim messages.
epoch-claim = ["docker", "hashmerchant", "dep:cw-headstash", "dep:cosmwasm-std"]
smartaccount = []
globalfee = []
akash = []
nostr = ["dep:tokio-tungstenite", "dep:futures-util"]
# Local Zakura (Zcash regtest) node spawn for private-bridge Option D / D6.
# Requires Docker runtime (bollard). Binary path: ZAKURAD_BIN or ZakuraNodeConfig.
zakura = ["docker"]
dregg-node = ["docker"]
bitcoin = ["docker"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
bollard = { version = "0.18", optional = true }
# For Nostr NIP-01 WS client (local relay testing)
tokio-tungstenite = { version = "0.21", features = ["connect"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
cosmrs = { path = "../../cosmos-rust/cosmrs", package = "cosmrs", features = ["cosmwasm", "grpc"] }
log = "0.4.22"
prost = "0.14"
ics23 = { path = "../../ics23/rust", package = "ics23", default-features = false, features = ["std", "host-functions"] }
tendermint = { path = "../../tendermint-rs/tendermint", package = "tendermint" }
tendermint-rpc = { path = "../../tendermint-rs/rpc", package = "tendermint-rpc", features = ["http-client", "websocket-client"] }
tonic = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
bip32 = "0.5"
bip39 = { version = "2", features = ["default"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
sha2 = "0.10"
sha3 = { version = "0.10", optional = true }

# Utilities
tempfile = "3"
bech32 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
cw-headstash = { path = "../../headstash/contracts/cw-headstash", optional = true, default-features = false, features = ["interface"] }
cosmwasm-std = { path = "../../cosmwasm/packages/std", optional = true }
rand = "0.8"
toml = "0.8"
tracing = "0.1"

# Derive macros
cw-orch-core = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0", features = ["terp"] }
# Force halo2-compatible rayon when a sibling crate enables zk
rayon = "=1.10.0"
ict-rs-derive = { path = "../ict-rs-derive" }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bip39 = { version = "2", features = ["default"] }
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = { version = "3", optional = false }
terp-rs = { path = "../../terp-rs/crates/sdk", package = "terp-rs", features = ["rpc"] }
zk-cosmwasm = { path = "../../cosmwasm/packages/zk", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "runtime_bench"
harness = false

